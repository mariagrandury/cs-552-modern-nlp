<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NLP Cheat Sheet (md)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
@page { size: A4 landscape; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #fff; color: #000; }
body {
  font-family: 'Times New Roman', Times, serif;
  padding: 10px;
}

/* A4 landscape @96dpi: 1123 × 794 */
.sheet {
  width: 1123px;
  height: 1588px;              /* 2 × A4 landscape height */
  margin: 0 auto;
  padding: 10px 12px;
  border: 1px solid #000;
  column-count: 3;
  column-gap: 10px;
  column-fill: auto;           /* fill col1 top→bottom, then col2, then col3 */
  column-rule: 1px solid #000;
  background:
    linear-gradient(#000, #000) left 794px / 100% 1px no-repeat;  /* page divider */
  font-size: 10px;
  line-height: 1.32;
}

.sheet h1 { display: none; }    /* title hidden — it's just the top-of-file banner */
.sheet h2 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: .4px;
  border-bottom: 1px solid #000;
  padding-bottom: 1px;
  margin: 4px 0 2px;
  break-after: avoid;
}
.sheet h3 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 10px;
  font-weight: bold;
  margin: 3px 0 1px;
  break-after: avoid;
}
.sheet p { margin: 0 0 2px; }
.sheet ul, .sheet ol { padding-left: 12px; margin: 0 0 2px; }
.sheet li { margin-bottom: 1px; }
.sheet pre {
  font-family: 'Courier New', monospace;
  font-size: 9px;
  line-height: 1.4;
  white-space: pre;
  margin: 2px 0;
  padding: 2px 3px;
  border: 1px solid #000;
  break-inside: avoid;
  overflow: hidden;
}
.sheet code {
  font-family: 'Courier New', monospace;
  font-size: 9px;
}
.sheet hr {
  border: none;
  border-top: 1px dashed #000;
  margin: 3px 0;
}
.sheet table {
  width: 100%;
  border-collapse: collapse;
  font-size: 9px;
  margin: 2px 0;
  break-inside: avoid;
}
.sheet th, .sheet td {
  border: 1px solid #000;
  padding: 1px 3px;
  text-align: left;
  vertical-align: top;
}
.sheet th { font-weight: bold; }
.sheet blockquote {
  border-left: 2px solid #000;
  padding-left: 5px;
  margin: 2px 0;
  font-style: italic;
}
.katex { font-size: 1em !important; }

@media print {
  body { padding: 0; }
  .sheet { border: none; }
}
</style>
</head>
<body>

<div class="sheet" id="sheet">Loading cheatsheet.md…</div>

<script>
(async () => {
  const res = await fetch('cheatsheet.md');
  const md  = await res.text();
  const el  = document.getElementById('sheet');
  el.innerHTML = marked.parse(md);
  renderMathInElement(el, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$',  right: '$',  display: false }
    ],
    throwOnError: false
  });
})();
</script>
</body>
</html>
