<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>NLP Cheat Sheet (md)</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.css">
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/katex.min.js"></script>
<script defer src="https://cdnjs.cloudflare.com/ajax/libs/KaTeX/0.16.9/contrib/auto-render.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
<style>
@page { size: A4 landscape; margin: 0; }
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { background: #ddd; color: #000; }
body {
  font-family: 'Times New Roman', Times, serif;
  padding: 6mm;
}

/* each sheet = exactly one A4 landscape page */
.sheet {
  width: 297mm;
  height: 210mm;
  margin: 0 auto 6mm;
  padding: 4mm 5mm;
  background: #fff;
  border: 1px solid #000;
  column-count: 3;
  column-gap: 4mm;
  column-fill: auto;           /* fill col1 top→bottom, then col2, then col3 */
  column-rule: 1px solid #000;
  page-break-after: always;
  overflow: hidden;
  font-size: 10px;
  line-height: 1.32;
}

.sheet h1 { display: none; }
.sheet h2 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 11px;
  font-weight: bold;
  text-transform: uppercase;
  letter-spacing: .4px;
  border-bottom: 1px solid #000;
  padding-bottom: 1px;
  margin: 4px 0 2px;
  break-after: avoid;
}
.sheet h3 {
  font-family: Arial, Helvetica, sans-serif;
  font-size: 10px;
  font-weight: bold;
  margin: 3px 0 1px;
  break-after: avoid;
}
.sheet p { margin: 0 0 2px; }
.sheet ul, .sheet ol { padding-left: 12px; margin: 0 0 2px; }
.sheet li { margin-bottom: 1px; }
.sheet pre {
  font-family: 'Courier New', monospace;
  font-size: 9px;
  line-height: 1.4;
  white-space: pre;
  margin: 2px 0;
  padding: 2px 3px;
  border: 1px solid #000;
  break-inside: avoid;
  overflow: hidden;
}
.sheet code {
  font-family: 'Courier New', monospace;
  font-size: 9px;
}
.sheet hr {
  border: none;
  border-top: 1px dashed #000;
  margin: 3px 0;
}
.sheet table {
  width: 100%;
  border-collapse: collapse;
  font-size: 9px;
  margin: 2px 0;
  break-inside: avoid;
}
.sheet th, .sheet td {
  border: 1px solid #000;
  padding: 1px 3px;
  text-align: left;
  vertical-align: top;
}
.sheet th { font-weight: bold; }
.sheet blockquote {
  border-left: 2px solid #000;
  padding-left: 5px;
  margin: 2px 0;
  font-style: italic;
}
.katex { font-size: 1em !important; }

@media print {
  html, body { background: #fff; }
  body { padding: 0; }
  .sheet { border: none; margin: 0; box-shadow: none; }
}
</style>
</head>
<body>

<div class="sheet" id="page1">Loading cheatsheet.md…</div>
<div class="sheet" id="page2"></div>

<script>
(async () => {
  const res = await fetch('cheatsheet.md');
  const md  = await res.text();

  const page1 = document.getElementById('page1');
  const page2 = document.getElementById('page2');
  page1.innerHTML = marked.parse(md);

  // render math first, since it changes element heights
  renderMathInElement(page1, {
    delimiters: [
      { left: '$$', right: '$$', display: true },
      { left: '$',  right: '$',  display: false }
    ],
    throwOnError: false
  });

  // give layout a tick, then move overflowing blocks to page 2
  await new Promise(r => requestAnimationFrame(r));

  // with column-fill:auto + fixed height, overflow grows horizontally:
  // scrollWidth > clientWidth means content didn't fit in 3 columns.
  while (page1.scrollWidth > page1.clientWidth + 1 && page1.lastElementChild) {
    const el = page1.lastElementChild;
    page2.insertBefore(el, page2.firstChild);
  }
})();
</script>
</body>
</html>
